<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description"
        content="Mobile Application Developer specializing in Flutter, focused on building high-performance cross-platform applications for Android, iOS, Web, and Desktop.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.jpg"/>

  <title>Ibrahim Omran</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .splash-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
      );
    }

    .logo-container {
      position: relative;
      margin-bottom: 30px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      object-fit: cover;
      animation: float 2.5s ease-in-out infinite;
      box-shadow:
        0 0 30px rgba(59,130,246,.3),
        0 0 60px rgba(59,130,246,.15);
    }

    .glow {
      position: absolute;
      inset: -10px;
      border-radius: 40px;
      border: 2px solid rgba(59,130,246,.3);
      animation: pulse 2s infinite;
    }

    h1 {
      color: white;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 35px;
      text-align: center;
      padding: 0 20px;
    }

    .loader {
      width: 240px;
      height: 6px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loader::before {
      content: '';
      position: absolute;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa
      );
      border-radius: 999px;
      animation: loading 1.2s infinite;
    }

    .loading-text {
      margin-top: 18px;
      color: #64748b;
      font-size: 13px;
      letter-spacing: 1px;
    }

    @keyframes loading {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: .5;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: .5;
      }
    }

    .fade-out {
      animation: fadeOut .6s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>

<body>

<div class="splash-screen" id="splash">

  <div class="logo-container">
    <div class="glow"></div>

    <!-- حط صورتك أو اللوجو -->
    <img
            src="favicon.jpg"
            class="logo"
            alt="Ibrahim Omran"
    >
  </div>

  <h1>Ibrahim Omran</h1>

  <p>
    Flutter Developer • Android • iOS • Web • Desktop
  </p>

  <div class="loader"></div>

  <div class="loading-text">
    LOADING PORTFOLIO...
  </div>

</div>

<script>
  window.addEventListener('flutter-first-frame', function () {
    const splash = document.getElementById('splash');

    splash.classList.add('fade-out');

    setTimeout(() => {
      splash.remove();
    }, 700);
  });
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
